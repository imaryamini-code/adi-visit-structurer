<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 — ADI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: var(--font);
      padding: 24px;
    }

    .shell {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      overflow: hidden;
    }

    .card-header {
      background: #fdf0f0;
      border-bottom: 1px solid #f5c6c6;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lock-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--r-sm);
      background: white;
      border: 1px solid #f5c6c6;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
      color: #c0392b;
    }

    .header-text {
      flex: 1;
    }

    .header-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #c0392b;
      margin-bottom: 2px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .badge-403 {
      font-size: 10px;
      font-weight: 800;
      background: white;
      color: #c0392b;
      border: 1px solid #f5c6c6;
      padding: 3px 8px;
      border-radius: var(--r-sm);
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .card-body {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 13px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
    }

    .meta-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-2);
    }

    .meta-value {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      font-family: 'DM Mono', 'Courier New', monospace;
    }

    .meta-value.deny {
      color: #c0392b;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.65;
      padding: 2px 2px 6px;
    }

    .btn-primary {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 11px 16px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.88; }

    .btn-secondary {
      display: block;
      width: 100%;
      text-align: center;
      padding: 10px 16px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary:hover {
      color: var(--text);
      border-color: var(--muted-2);
    }

    .footer-note {
      font-size: 11px;
      color: var(--muted-2);
      text-align: center;
    }

    .footer-note span {
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <div class="shell">

    <div class="card">

      <div class="card-header">
        <div class="lock-icon">&#128274;</div>
        <div class="header-text">
          <div class="header-label">Access denied</div>
          <div class="header-title">Insufficient permissions</div>
        </div>
        <div class="badge-403">403</div>
      </div>

      <div class="card-body">

        <div class="meta-row">
          <span class="meta-label">Role</span>
          <span class="meta-value">{{ role }}</span>
        </div>

        <div class="meta-row">
          <span class="meta-label">Resource</span>
          <span class="meta-value">/assistant</span>
        </div>

        <div class="meta-row">
          <span class="meta-label">Decision</span>
          <span class="meta-value deny">ABAC_DENY</span>
        </div>

        <p class="hint">
          Your account does not have access to this area.
          Contact your system administrator if you believe this is incorrect.
        </p>

        <a href="/assistant" class="btn-primary" style="margin-top:4px;">Go to your workspace</a>

        <form action="/api/logout" method="post" style="margin:0;">
          <button type="submit" class="btn-secondary">Log out and switch account</button>
        </form>

      </div>
    </div>

    <p class="footer-note">
      ADI Assistant <span>·</span> Access event logged
    </p>

  </div>
</body>
</html>
